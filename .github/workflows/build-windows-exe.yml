name: Build Windows EXE on Release

on:
  release:
    types: [published]
  workflow_dispatch:  # 允许手动触发构建

permissions:
  contents: write  # 用于上传到 releases

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code with tag information
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取所有历史记录以便获取标签

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies with uv
      # uv.lock 不被 git 跟踪，CI 检出后不存在，需先 uv lock 生成锁文件再以 frozen 安装
      run: |
        uv lock
        uv sync --frozen --extra build

    - name: Build executable with Nuitka
      id: build
      # build.py 在 CI 中：解析版本（GITHUB_REF 标签）→ 更新 src/__init__.py →
      # Nuitka 构建 → 重命名 exe → 输出 version/nuitka_version 到 GITHUB_OUTPUT
      run: |
        uv run python build.py

    - name: Create zip package
      run: |
        $version = "${{ steps.build.outputs.version }}"
        $zipPath = "dist\QQFavoriteExtract_$version.zip"
        $filesToInclude = @(
            "dist\QQFavoriteExtract_$version.exe",
            "LICENSE",
            "README.md"
        ) | Where-Object { Test-Path $_ }
        Compress-Archive -Path $filesToInclude -DestinationPath $zipPath -Force
        Write-Host "Created package: $zipPath"

    - name: Upload standalone EXE as artifact
      uses: actions/upload-artifact@v4
      with:
        name: QQFavoriteExtract-Windows-${{ steps.build.outputs.version }}
        path: |
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}.exe
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}.zip
        retention-days: 7

    - name: Upload to GitHub Release
      if: github.event_name == 'release'  # 仅当发布时上传到 Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        generate_release_notes: false
        draft: false
        prerelease: false
        files: |
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}.exe
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
