name: Build Windows EXE (Push / Manual)

# 日常提交自动构建 Windows 产物，仅作为 Actions Artifacts 留存，不创建 Release。
# 需要正式发版请打 tag：git tag v1.5.6 && git push origin v1.5.6（由 release.yml 构建并发布）

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'img/**'
      - 'build.py'
      - 'pyproject.toml'
      - '.github/workflows/build-windows-exe.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本号（不带 v，留空则用 pyproject.toml 里的版本）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true  # 同一分支的旧构建被新提交取代时直接取消，省 runner 时间

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies with uv
      # uv.lock 不被 git 跟踪，CI 检出后不存在，需先 uv lock 生成锁文件再以 frozen 安装
      run: |
        uv lock
        uv sync --frozen --extra build --group dev

    - name: Resolve version and short sha
      id: meta
      shell: bash
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        VERSION="${INPUT_VERSION:-}"
        VERSION="${VERSION#v}"
        if [ -z "$VERSION" ]; then
          VERSION="$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Build PyInstaller single-file version
      id: build
      env:
        BUILD_VERSION: ${{ steps.meta.outputs.version }}
      run: |
        uv run python build.py --pyinstaller --single

    - name: Build PyInstaller portable version
      env:
        BUILD_VERSION: ${{ steps.meta.outputs.version }}
      run: |
        uv run python build.py --pyinstaller --multi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QQFavoriteExtract-Windows-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}
        path: |
          dist/QQFavoriteExtract_${{ steps.meta.outputs.version }}_pyinstaller_onefile.exe
          dist/QQFavoriteExtract_${{ steps.meta.outputs.version }}_pyinstaller_portable.zip
        if-no-files-found: error
        retention-days: 30
