name: Release (Auto Build & Publish)

# 打 tag 即自动发版：构建产物 → 按 Conventional Commits 生成更新日志 → 创建 Release 并挂上产物
# 用法：git tag v1.5.6 && git push origin v1.5.6
# 也可以在 Actions 页面手动触发（workflow_dispatch）：填版本号即可，无需先建 tag

# 只接受纯数字版本号的 tag（build.py 的 normalize_version 不允许 dev/beta 之类后缀）
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 1.5.6）'
        required: true
        type: string
      draft:
        description: '创建为草稿 Release（不对外发布，可先在网页上修改后再发布）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # 创建 Release 并上传产物

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # 发布流程不并发取消，避免半截产物覆盖已有 Release

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90  # 两次 PyInstaller 构建 + 上传产物

    steps:
    - name: Checkout code with full history and tags
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 生成更新日志需要「上一个 tag..本次 tag」的完整提交历史
        fetch-tags: true

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies with uv
      # uv.lock 不被 git 跟踪，CI 检出后不存在，需先 uv lock 生成锁文件再以 frozen 安装
      run: |
        uv lock
        uv sync --frozen --extra build --group dev

    - name: Resolve version and tag
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      # tag 推送时版本号来自标签；手动触发时来自输入框（必须显式提供，避免误发）
      run: |
        VERSION="${INPUT_VERSION:-}"
        if [ -z "$VERSION" ]; then
          VERSION="${GITHUB_REF_NAME}"
        fi
        VERSION="${VERSION#v}"
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)+$'; then
          echo "::error::版本号格式不合法：$VERSION（应形如 1.5.6）"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Warn on version mismatch with pyproject.toml
      shell: bash
      # 版本号以 tag / 输入为准写进产物；pyproject.toml 只作提示，避免忘改导致下次默认构建的产物版本落后
      run: |
        PYPROJECT_VERSION="$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
        if [ "$PYPROJECT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
          echo "::warning title=版本号不一致::pyproject.toml 是 $PYPROJECT_VERSION，本次发布是 ${{ steps.version.outputs.version }}；建议发版时一并更新 pyproject.toml 的 version"
        fi

    - name: Build PyInstaller single-file version
      id: build
      # build.py：按 BUILD_VERSION / 标签解析版本 → 更新 src/__init__.py → 构建并重命名 → 输出 version
      env:
        BUILD_VERSION: ${{ steps.version.outputs.version }}
      run: |
        uv run python build.py --pyinstaller --single

    - name: Build PyInstaller portable version
      env:
        BUILD_VERSION: ${{ steps.version.outputs.version }}
      run: |
        uv run python build.py --pyinstaller --multi

    - name: Generate changelog
      shell: bash
      # 自定义脚本按 Conventional Commits 归类「上一个 tag..本次 tag」的提交，再拼上下载说明模板
      run: |
        uv run python .github/scripts/changelog.py \
          --to "${{ steps.version.outputs.tag }}" \
          --version "${{ steps.version.outputs.version }}" \
          --repo "$GITHUB_REPOSITORY" \
          --template .github/templates/release-notes-tail.md \
          --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.version.outputs.tag }}" \
          --out release-notes.md
        echo "----- 生成的 Release 正文 -----"
        cat release-notes.md

    - name: Publish release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.version.outputs.tag }}
        VERSION: ${{ steps.version.outputs.version }}
        DRAFT: ${{ github.event.inputs.draft }}
      # Release 已存在（例如之前手动建过）时改为更新正文并覆盖产物，保证重复运行是幂等的
      run: |
        FILES=(
          "dist/QQFavoriteExtract_${VERSION}_pyinstaller_onefile.exe"
          "dist/QQFavoriteExtract_${VERSION}_pyinstaller_portable.zip"
        )
        for f in "${FILES[@]}"; do
          if [ ! -f "$f" ]; then
            echo "::error::缺少构建产物：$f"
            exit 1
          fi
        done

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG 已存在，更新说明与产物"
          gh release edit "$TAG" --notes-file release-notes.md
          gh release upload "$TAG" "${FILES[@]}" --clobber
        else
          EXTRA=()
          if [ "$DRAFT" = "true" ]; then
            EXTRA+=(--draft)
          fi
          # 手动触发时 tag 可能还不存在，由 gh 在此提交点上创建
          if [ -n "${{ github.event.inputs.version }}" ]; then
            EXTRA+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${EXTRA[@]}" \
            "${FILES[@]}"
        fi
        echo "Release $TAG 发布完成"
