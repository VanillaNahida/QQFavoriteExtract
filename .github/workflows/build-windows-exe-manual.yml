name: Build Windows EXE (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 GITHUB_REF 标签 / pyproject.toml 读取）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90  # 四种构建（Nuitka/PyInstaller x 单文件/多文件）耗时较长

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies with uv
      # uv.lock 不被 git 跟踪，CI 检出后不存在，需先 uv lock 生成锁文件再以 frozen 安装
      # --group dev 显式安装 pyinstaller（build 脚本的 PyInstaller 打包器依赖）
      run: |
        uv lock
        uv sync --frozen --extra build --group dev

    - name: 构建 Nuitka 单文件版
      id: build
      # build.py 在 CI 中：解析版本（BUILD_VERSION 优先）→ 更新 src/__init__.py →
      # 按参数构建并重命名产物 → 输出 version/nuitka_version 到 GITHUB_OUTPUT
      env:
        BUILD_VERSION: ${{ github.event.inputs.version }}
      run: |
        uv run python build.py --nuitka --single

    - name: 构建 Nuitka 多文件版
      env:
        BUILD_VERSION: ${{ github.event.inputs.version }}
      run: |
        uv run python build.py --nuitka --multi

    - name: 构建 PyInstaller 单文件版
      env:
        BUILD_VERSION: ${{ github.event.inputs.version }}
      run: |
        uv run python build.py --pyinstaller --single

    - name: 构建 PyInstaller 多文件版
      env:
        BUILD_VERSION: ${{ github.event.inputs.version }}
      run: |
        uv run python build.py --pyinstaller --multi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QQFavoriteExtract-Windows-${{ steps.build.outputs.version }}
        path: |
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}_nuitka_onefile.exe
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}_nuitka_portable.zip
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}_pyinstaller_onefile.exe
          dist/QQFavoriteExtract_${{ steps.build.outputs.version }}_pyinstaller_portable.zip
        retention-days: 7
