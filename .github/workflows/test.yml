name: Test

# 普通提交与 PR 只做静态检查和冒烟测试，不构建产物（构建见 build-windows-exe.yml / release.yml）
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'img/**'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # 同一分支连推多次时取消旧任务

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies with uv
      # uv.lock 不被 git 跟踪，CI 检出后不存在，需先 uv lock 生成锁文件再以 frozen 安装
      # --group dev 安装 ruff（dev 依赖组）
      run: |
        uv lock
        uv sync --frozen --group dev

    - name: Ruff lint check
      # 规则配置见 pyproject.toml 的 [tool.ruff]；存在违规时非零退出码使步骤失败
      run: |
        uv run ruff check .

    - name: Python syntax compilation check
      # 语法错误时 compileall 返回非零退出码，直接导致该步骤失败
      run: |
        uv run python -m compileall -q src build.py

    - name: Core Module Import Smoke Test
      # offscreen 平台避免依赖图形环境；main() 有 __main__ 保护，导入不会启动 GUI
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        uv run python -c "import src.main; print('Application entry module imported successfully!')"
